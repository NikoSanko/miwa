name: Site diff

on: pull_request

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the PR head commit (not the merge commit) so the diff is
          # labelled and linked against what the author pushed.
          ref: ${{ github.event.pull_request.head.sha }}
          # `site --diff` needs full history to locate the merge-base; a shallow
          # clone makes it exit with code 1.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          cargo run --locked -- site --diff \
            --base "origin/${BASE_REF}" \
            --head-label "${HEAD_REF}" \
            --out _site-diff.html \
            --link-base "https://github.com/${REPO}/blob/${HEAD_SHA}/"

      - name: Check the output
        id: output
        run: |
          if [ -f _site-diff.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the diff
        id: upload
        if: steps.output.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: _site-diff.html
          archive: false
          retention-days: 14

      - name: Comment on the PR
        # Forks get a read-only token, so skip commenting for them.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          EXISTS: ${{ steps.output.outputs.exists }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- miwa-site-diff -->';
            const short = process.env.HEAD_SHA.slice(0, 7);
            const body = process.env.EXISTS === 'true'
              ? `${marker}\n[差分 HTML を開く](${process.env.ARTIFACT_URL}) (${short})`
              : `${marker}\n変更なし (${short})`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
