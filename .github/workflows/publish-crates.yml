# Publishes miwa-cli to crates.io. Called from release.yml (generated by dist).
#
# crates.io Trusted Publishing: crates.io matches the `workflow_ref` claim of
# the OIDC token. For a reusable workflow that claim names the top-level
# (calling) workflow, so register "release.yml" as the workflow of the Trusted
# Publisher, not this file (publish-crates.yml). If the token request fails
# with a workflow mismatch, the error shows the name crates.io saw.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (JSON), passed by release.yml
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Always run this step, even when the version is already published, so a
      # broken Trusted Publishing setup is noticed on every release.
      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Check whether this version is already on crates.io
        id: check
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # Sparse index path for a name of 4+ characters: <first 2>/<next 2>/<name>.
          url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
          status=$(curl -sS --retry 3 -o index.json -w '%{http_code}' "$url")
          case "$status" in
            200)
              if jq -e --arg v "$version" 'select(.vers == $v)' index.json > /dev/null; then
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "$crate $version is already on crates.io; skipping publish."
              else
                echo "published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "$crate is not on crates.io yet."
              ;;
            *)
              echo "Unexpected HTTP status $status from $url" >&2
              exit 1
              ;;
          esac

      - name: Publish
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
