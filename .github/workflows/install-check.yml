# Checks that the install routes (installers, manual download, cargo binstall,
# cargo install, install-action) yield a working `miwa`.
# Called from release.yml after the release is announced (dist post-announce
# job), or run by hand with a version to re-check a published release.
name: Install check

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (JSON), passed by release.yml
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to check, without the leading v (for example 0.5.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # GitHub Releases base URL; the installers live under the tag of the version.
  RELEASE_BASE: https://github.com/NikoSanko/miwa/releases/download

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          PLAN: ${{ inputs.plan }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # A workflow_call run has `plan`; a workflow_dispatch run has `version`.
          if [ -n "$PLAN" ]; then
            version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  shell-installer:
    name: Shell installer (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install with the shell installer
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "$RELEASE_BASE/v$VERSION/miwa-cli-installer.sh" | sh
          # The installer edits shell profiles; later steps need the PATH entry too.
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Check miwa --version
        run: |
          command -v miwa
          out=$(miwa --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]

  powershell-installer:
    name: PowerShell installer (windows-latest)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install with the PowerShell installer
        shell: pwsh
        run: |
          irm "$env:RELEASE_BASE/v$env:VERSION/miwa-cli-installer.ps1" | iex
          # The installer edits the user PATH; later steps need the entry too.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cargoHome "bin")

      - name: Check miwa --version
        shell: bash
        run: |
          command -v miwa
          out=$(miwa --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]

  manual-download:
    name: Manual download (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.xz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: miwa-cli-${{ matrix.target }}.${{ matrix.ext }}
    steps:
      - name: Download the archive and its checksum
        shell: bash
        run: |
          mkdir dl
          cd dl
          curl --proto '=https' --tlsv1.2 -fsSLO "$RELEASE_BASE/v$VERSION/$ARCHIVE"
          curl --proto '=https' --tlsv1.2 -fsSLO "$RELEASE_BASE/v$VERSION/$ARCHIVE.sha256"

      - name: Verify the checksum (Linux)
        if: runner.os == 'Linux'
        working-directory: dl
        run: sha256sum -c "$ARCHIVE.sha256"

      - name: Verify the checksum (macOS)
        if: runner.os == 'macOS'
        working-directory: dl
        run: shasum -a 256 -c "$ARCHIVE.sha256"

      - name: Verify the checksum (Windows)
        if: runner.os == 'Windows'
        working-directory: dl
        shell: pwsh
        run: |
          $expected = ((Get-Content "$env:ARCHIVE.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $env:ARCHIVE).Hash
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected, got $actual"
          }

      - name: Extract (tar.xz)
        if: matrix.ext == 'tar.xz'
        working-directory: dl
        run: tar -xf "$ARCHIVE"

      - name: Extract (zip)
        if: matrix.ext == 'zip'
        working-directory: dl
        shell: pwsh
        run: Expand-Archive -Path $env:ARCHIVE -DestinationPath extracted

      - name: Check miwa --version
        shell: bash
        run: |
          # tar.xz archives hold a miwa-cli-<target>/ directory; the zip is flat.
          if [ "${{ matrix.ext }}" = "zip" ]; then
            bin="dl/extracted/miwa.exe"
          else
            bin="dl/miwa-cli-${{ matrix.target }}/miwa"
          fi
          out=$("$bin" --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]

  cargo-binstall:
    name: cargo binstall
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install cargo-binstall
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall

      - name: Install with cargo binstall
        run: |
          # Use only the binaries in the GitHub Release: no QuickInstall, no source build.
          # Retry because the crates.io index can lag behind a fresh publish.
          for attempt in 1 2 3 4; do
            if cargo binstall --no-confirm --strategies crate-meta-data "miwa-cli@=$VERSION"; then
              echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 60s" >&2
            sleep 60
          done
          exit 1

      - name: Check miwa --version
        run: |
          command -v miwa
          out=$(miwa --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]

  install-action:
    name: taiki-e/install-action
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # install-action has no built-in manifest for miwa-cli, so it falls back to
      # cargo-binstall (crate metadata, then QuickInstall, then a source build).
      # It offers no way to limit those strategies (only `fallback: none|cargo-install`),
      # so this route can pass without using the Release binaries; the cargo-binstall
      # job above is the strict check of those. Retry because the crates.io index can
      # lag behind a fresh publish.
      - name: Install (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: miwa-cli@${{ env.VERSION }}

      - name: Wait before attempt 2
        if: steps.attempt1.outcome == 'failure'
        run: sleep 60

      - name: Install (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: miwa-cli@${{ env.VERSION }}

      - name: Wait before attempt 3
        if: steps.attempt2.outcome == 'failure'
        run: sleep 120

      - name: Install (attempt 3)
        if: steps.attempt2.outcome == 'failure'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: miwa-cli@${{ env.VERSION }}

      - name: Check miwa --version
        run: |
          command -v miwa
          out=$(miwa --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]

  cargo-install:
    name: cargo install
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install with cargo install
        run: |
          # Retry because the crates.io index can lag behind a fresh publish.
          for attempt in 1 2 3 4; do
            if cargo install miwa-cli --version "=$VERSION" --locked; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 60s" >&2
            sleep 60
          done
          exit 1

      - name: Check miwa --version
        run: |
          command -v miwa
          out=$(miwa --version)
          echo "$out"
          [ "$out" = "miwa $VERSION" ]
