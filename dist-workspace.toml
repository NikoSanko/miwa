[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Checksums to generate for each App
checksum = "sha256"
# On pull requests, only run `dist plan` (no release builds)
pr-run-mode = "plan"
# Custom jobs: verify before building, publish to crates.io, check installs after announce
plan-jobs = ["./release-verify"]
publish-jobs = ["./publish-crates"]
post-announce-jobs = ["./install-check"]

[dist.github-custom-runners]
# tree-sitter contains C code, so build on a native arm runner instead of cross compiling
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[dist.github-custom-job-permissions]
# Overriding drops the default permissions, so list everything the job needs
publish-crates = { contents = "read", id-token = "write" }

[dist.github-action-commits]
# Pin every action used by the generated workflow to a full commit SHA
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2
