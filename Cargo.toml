[package]
name = "miwa"
version = "0.3.0"
edition = "2021"
description = "doc / req / test の3層の仕様乖離（ドリフト）を検知する CLI"
repository = "https://github.com/NikoSanko/miwa"
readme = "README.md"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
